name: Library CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/library/**'
      - '.github/workflows/library-ci.yml'
  pull_request:
    paths:
      - 'projects/library/**'
      - '.github/workflows/library-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/library

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn --batch-mode -DskipTests package

  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests ausfuehren und Coverage pruefen
        run: mvn --batch-mode verify
      - name: HTML-Reports erzeugen
        if: always()
        run: mvn --batch-mode surefire-report:report-only site:site -DgenerateReports=false
      - name: Reports fuer die Veroeffentlichung zusammenstellen
        if: always()
        run: |
          mkdir -p public/tests public/coverage
          cp -r target/reports/. public/tests/
          mv public/tests/surefire.html public/tests/index.html
          cp -r target/site/jacoco/. public/coverage/ || echo "Kein Coverage-Report vorhanden"
          cp pages/index.html public/index.html
      - name: Testresultate als Check-Run anzeigen
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'projects/library/target/surefire-reports/TEST-*.xml'
      - name: Reports als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-reports
          path: projects/library/public
          retention-days: 30

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: library-reports
          path: public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Reports auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
