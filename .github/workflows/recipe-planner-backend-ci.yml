name: Recipe Planner Backend CI

# Aufgabe 3 (Automatisiertes Testen und Deployen): entspricht den drei Stages
# build -> test -> deploy aus der Theorie, nur mit GitHub Actions statt
# GitLab CI (beides laut Aufgabenstellung erlaubt, das Repo liegt auf GitHub).
# Jeder Push/PR, der etwas am Backend aendert, triggert die Pipeline.

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/recipe-planner/recipe-planner-backend/**'
      - '.github/workflows/recipe-planner-backend-ci.yml'
  pull_request:
    paths:
      - 'projects/recipe-planner/recipe-planner-backend/**'
      - '.github/workflows/recipe-planner-backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

defaults:
  run:
    working-directory: projects/recipe-planner/recipe-planner-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        run: mvn --batch-mode compile

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit-Tests ausfuehren (Surefire + JaCoCo)
        run: mvn --batch-mode test
      - name: Testreport als Check-Run veroeffentlichen
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'projects/recipe-planner/recipe-planner-backend/target/surefire-reports/TEST-*.xml'
      - name: Reports als Artefakt hochladen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-report
          path: |
            projects/recipe-planner/recipe-planner-backend/target/surefire-reports/
            projects/recipe-planner/recipe-planner-backend/target/site/jacoco/
          retention-days: 30

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Report-Verfuegbarkeit bestaetigen
        run: |
          echo "Test- und Coverage-Reports dieses Laufs stehen als Artefakt 'test-and-coverage-report' zum Download bereit."
          echo "JUnit-Ergebnisse sind zusaetzlich direkt als Check-Run auf diesem Commit/PR sichtbar."
